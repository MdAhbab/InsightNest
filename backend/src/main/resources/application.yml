server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/insightnest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-32-bytes-minimum}
    accessTokenMinutes: 30
    refreshTokenDays: 7
  bootstrap:
    secret: ${BOOTSTRAP_SECRET:}
  storage:
    path: ${STORAGE_PATH:storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AI advisory agents. When agent.llm.enabled is false (the committed default) the four
# agents run on the deterministic heuristic brain and need no external services. Set
# AGENT_LLM_ENABLED=true (and a reachable Ollama and/or API keys) to route them through an
# LLM. Providers are tried in order; on failure the next is used, and if all fail the
# heuristic brain answers — so the endpoints never hard-fail.
agent:
  llm:
    enabled: ${AGENT_LLM_ENABLED:false}
    providers: ${AGENT_LLM_PROVIDERS:ollama,openai,gemini}
    timeout-seconds: ${AGENT_TIMEOUT_SECONDS:60}
    temperature: ${AGENT_LLM_TEMPERATURE:0.4}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma4:e4b}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  # Deadline Sentinel weekly digest fan-out. Off by default so it never fires unexpectedly
  # in dev; the on-demand POST /api/v1/agent/sentinel/run endpoint works regardless.
  sentinel:
    enabled: ${AGENT_SENTINEL_ENABLED:false}
    cron: ${AGENT_SENTINEL_CRON:0 0 7 * * MON}
