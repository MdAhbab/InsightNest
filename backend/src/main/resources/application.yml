server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/insightnest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-32-bytes-minimum}
    accessTokenMinutes: 30
    refreshTokenDays: 7
  bootstrap:
    secret: ${BOOTSTRAP_SECRET:}
  storage:
    path: ${STORAGE_PATH:storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
